<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="65" ry="70" fill="#FFB6C1" stroke="#E891A8" stroke-width="3"/>
  <!-- Head point -->
  <ellipse cx="100" cy="45" rx="30" ry="35" fill="#FFB6C1" stroke="#E891A8" stroke-width="3"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="95" rx="14" ry="16" fill="white" stroke="#333" stroke-width="2"/>
  <ellipse cx="118" cy="95" rx="14" ry="16" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="85" cy="98" r="7" fill="#2d5016"/>
  <circle cx="115" cy="98" r="7" fill="#2d5016"/>
  <circle cx="87" cy="96" r="3" fill="white"/>
  <circle cx="117" cy="96" r="3" fill="white"/>
  <!-- Eyebrows -->
  <path d="M 68 78 Q 82 72 95 78" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 105 78 Q 118 72 132 78" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M 80 120 Q 100 135 120 120" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="65" cy="110" r="8" fill="#FF9999" opacity="0.4"/>
  <circle cx="135" cy="110" r="8" fill="#FF9999" opacity="0.4"/>
  <!-- Shorts -->
  <path d="M 40 135 Q 100 150 160 135 L 160 165 Q 100 175 40 165 Z" fill="#7BC74D" stroke="#5A9E2F" stroke-width="2"/>
  <!-- Dots on shorts -->
  <circle cx="70" cy="150" r="4" fill="#7BC74D" stroke="#5A9E2F" stroke-width="1"/>
  <circle cx="130" cy="150" r="4" fill="#7BC74D" stroke="#5A9E2F" stroke-width="1"/>
  <!-- Feet -->
  <ellipse cx="70" cy="188" rx="18" ry="8" fill="#FFB6C1" stroke="#E891A8" stroke-width="2"/>
  <ellipse cx="130" cy="188" rx="18" ry="8" fill="#FFB6C1" stroke="#E891A8" stroke-width="2"/>
</svg>
