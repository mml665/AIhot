<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="55" ry="50" fill="#E74C3C" stroke="#C0392B" stroke-width="3"/>
  <!-- Eyes stalks -->
  <rect x="70" y="45" width="12" height="30" rx="6" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <rect x="118" y="45" width="12" height="30" rx="6" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="76" cy="40" r="16" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="124" cy="40" r="16" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="42" r="8" fill="#2d5016"/>
  <circle cx="120" cy="42" r="8" fill="#2d5016"/>
  <circle cx="82" cy="40" r="3" fill="white"/>
  <circle cx="122" cy="40" r="3" fill="white"/>
  <!-- Nose -->
  <ellipse cx="100" cy="85" rx="6" ry="10" fill="#C0392B" stroke="#A93226" stroke-width="1.5"/>
  <!-- Mouth (smile) -->
  <path d="M 70 105 Q 100 130 130 105" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="88" y="105" width="8" height="8" rx="1" fill="white" stroke="#333" stroke-width="1"/>
  <rect x="104" y="105" width="8" height="8" rx="1" fill="white" stroke="#333" stroke-width="1"/>
  <!-- Belt -->
  <rect x="45" y="125" width="110" height="12" rx="3" fill="#2c3e50"/>
  <rect x="92" y="122" width="16" height="18" rx="3" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
  <text x="100" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">$</text>
  <!-- Claws -->
  <ellipse cx="25" cy="110" rx="20" ry="15" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <line x1="10" y1="110" x2="35" y2="110" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="175" cy="110" rx="20" ry="15" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <line x1="160" y1="110" x2="185" y2="110" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="70" y="155" width="10" height="25" rx="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <rect x="120" y="155" width="10" height="25" rx="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <!-- Shoes -->
  <ellipse cx="75" cy="185" rx="12" ry="6" fill="#1a1a2e"/>
  <ellipse cx="125" cy="185" rx="12" ry="6" fill="#1a1a2e"/>
</svg>
